<text x="891" y="603" fill="#83d7e1" font-family="DejaVu Sans,sans-serif" font-size="15">I²C + OE</text>
<path d="M1165 695 L1165 770" fill="none" stroke="#5bb8c8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1180" y="737" fill="#83d7e1" font-family="DejaVu Sans,sans-serif" font-size="15">PWM sinyali</text>
<text x="48" y="785" fill="#d7ba7e" font-size="16" font-family="DejaVu Sans,sans-serif">Bu diyagram devre şeması / PCB değildir.</text>
<text x="48" y="810" fill="#d7ba7e" font-size="16" font-family="DejaVu Sans,sans-serif">Kamera verisi Mega üzerinden taşınmaz.</text>
<text x="48" y="835" fill="#d7ba7e" font-size="16" font-family="DejaVu Sans,sans-serif">Kol ve takip henüz tamamlanmış özellikler değildir.</text>
