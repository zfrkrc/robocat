<text x="75" y="615" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">MPU6050, HC-SR04, LCD</text>
<text x="75" y="640" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Diğer sensörler aşamalı eklenecek</text>
