<text x="520" y="190" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Kişi / nesne tanıma, görev planı</text>
<text x="520" y="215" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Hedef takip ve kartvizit görevi</text>
