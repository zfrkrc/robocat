<text x="540" y="615" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Yerel hareket döngüsü</text>
<text x="540" y="640" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Servo kalibrasyonu, sensör okuma</text>
