<text x="75" y="385" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">2 sabit göz + 1 kol kamerası</text>
<text x="75" y="410" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Görüntü Wi-Fi ile merkeze gider</text>
