<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#85929e"/></marker></defs><rect width="1700" height="760" fill="#fbfaf7"/><text x="40" y="52" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#1b2631">RoboCat — montaj sırası</text><text x="40" y="78" font-family="DejaVu Sans" font-size="12.5" fill="#5d6d7e">Vida: eklemler · Yapıştırma: kapak/çerçeve · Ölçü: her adımda kuru deneme</text><rect x="40" y="110" width="1180" height="62" rx="10" fill="#ffffff" stroke="#d5dbdb"/><circle cx="72" cy="141" r="16" fill="#7d3c98"/><text x="72" y="147" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="104" y="137" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1b2631">Servo merkezleme</text><text x="104" y="158" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">Horn takmadan orta noktaya getir (≈1500 µs / 307 tick @60 Hz).</text><rect x="1240" y="126" width="120" height="30" rx="8" fill="#f4f6f7" stroke="#7d3c98"/><text x="1300" y="146" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" fill="#7d3c98" text-anchor="middle">ÖLÇ</text><line x1="72" y1="172" x2="72" y2="186" stroke="#85929e" stroke-width="2"/><rect x="40" y="186" width="1180" height="62" rx="10" fill="#ffffff" stroke="#d5dbdb"/><circle cx="72" cy="217" r="16" fill="#7d3c98"/><text x="72" y="223" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="104" y="213" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1b2631">25T horn</text><text x="104" y="234" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">Delik deseni 10,0 mm (ikincil 13,9 mm); merkez vidası dibe vurmasın.</text><rect x="1240" y="202" width="120" height="30" rx="8" fill="#f4f6f7" stroke="#7d3c98"/><text x="1300" y="222" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" fill="#7d3c98" text-anchor="middle">VİDA</text><line x1="72" y1="248" x2="72" y2="262" stroke="#85929e" stroke-width="2"/><rect x="40" y="262" width="1180" height="62" rx="10" fill="#ffffff" stroke="#d5dbdb"/><circle cx="72" cy="293" r="16" fill="#7d3c98"/><text x="72" y="299" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="104" y="289" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1b2631">625 rulman</text><text x="104" y="310" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">5×16×5 rulmanı Ø16 cebe, Ø5 mil geçir. Cep ≈3,6-4,0 mm; oturmazsa 5,2 mm ream.</text><rect x="1240" y="278" width="120" height="30" rx="8" fill="#f4f6f7" stroke="#7d3c98"/><text x="1300" y="298" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" fill="#7d3c98" text-anchor="middle">ÖLÇ</text><line x1="72" y1="324" x2="72" y2="338" stroke="#85929e" stroke-width="2"/><rect x="40" y="338" width="1180" height="62" rx="10" fill="#ffffff" stroke="#d5dbdb"/><circle cx="72" cy="369" r="16" fill="#7d3c98"/><text x="72" y="375" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="104" y="365" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1b2631">Bacak zinciri</text><text x="104" y="386" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">coax → femur → tibia. M3 geçiş, M4 pivot; eklem serbest mi kontrol et.</text><rect x="1240" y="354" width="120" height="30" rx="8" fill="#f4f6f7" stroke="#7d3c98"/><text x="1300" y="374" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" fill="#7d3c98" text-anchor="middle">VİDA</text><line x1="72" y1="400" x2="72" y2="414" stroke="#85929e" stroke-width="2"/><rect x="40" y="414" width="1180" height="62" rx="10" fill="#ffffff" stroke="#d5dbdb"/><circle cx="72" cy="445" r="16" fill="#2471a3"/><text x="72" y="451" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="104" y="441" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1b2631">Kafa kuru montaj</text><text x="104" y="462" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">Yüz + kasa + kapak; CAT06B 7×7 çerçeveyi Ø20 deliğe kuru yerleştir.</text><rect x="1240" y="430" width="120" height="30" rx="8" fill="#f4f6f7" stroke="#2471a3"/><text x="1300" y="450" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" fill="#2471a3" text-anchor="middle">ÖLÇ</text><line x1="72" y1="476" x2="72" y2="490" stroke="#85929e" stroke-width="2"/><rect x="40" y="490" width="1180" height="62" rx="10" fill="#ffffff" stroke="#d5dbdb"/><circle cx="72" cy="521" r="16" fill="#b03a2e"/><text x="72" y="527" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="104" y="517" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1b2631">Yapıştırma</text><text x="104" y="538" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">Burun, göz çerçevesi, kapaklar: nötr silikon/CA, ince film, IPA, 24 saat.</text><rect x="1240" y="506" width="120" height="30" rx="8" fill="#f4f6f7" stroke="#b03a2e"/><text x="1300" y="526" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" fill="#b03a2e" text-anchor="middle">YAPIŞTIR</text><line x1="72" y1="552" x2="72" y2="566" stroke="#85929e" stroke-width="2"/><rect x="40" y="566" width="1180" height="62" rx="10" fill="#ffffff" stroke="#d5dbdb"/><circle cx="72" cy="597" r="16" fill="#148f77"/><text x="72" y="603" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">7</text><text x="104" y="593" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1b2631">Kablolama</text><text x="104" y="614" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">Servo uzatmaları eklem içinden; sıkışma ve keskin kenar olmasın.</text><rect x="1240" y="582" width="120" height="30" rx="8" fill="#f4f6f7" stroke="#148f77"/><text x="1300" y="602" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" fill="#148f77" text-anchor="middle">ÖLÇ</text><line x1="72" y1="628" x2="72" y2="642" stroke="#85929e" stroke-width="2"/><rect x="40" y="642" width="1180" height="62" rx="10" fill="#ffffff" stroke="#d5dbdb"/><circle cx="72" cy="673" r="16" fill="#148f77"/><text x="72" y="679" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">8</text><text x="104" y="669" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1b2631">Kafa gövdeye</text><text x="104" y="690" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">En son tak; ağırlık merkezi ve kablo payı kontrol edilir.</text><rect x="1240" y="658" width="120" height="30" rx="8" fill="#f4f6f7" stroke="#148f77"/><text x="1300" y="678" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" fill="#148f77" text-anchor="middle">VİDA</text><rect x="1390" y="110" width="280" height="250" rx="12" fill="#fdf2f0" stroke="#b03a2e"/><text x="1410" y="142" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1b2631">Yapıştırma notu</text><text x="1410" y="172" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">· Nötr silikon: sökülebilir</text><text x="1410" y="204" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">· CA: hızlı, kırılgan, beyazlar</text><text x="1410" y="236" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">· İnce film; kalın silikon ayrılır</text><text x="1410" y="268" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">· IPA ile sil, 24 saat kür</text><text x="1410" y="300" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">· Eklem/pivot yapıştırılmaz</text><rect x="1390" y="380" width="280" height="230" rx="12" fill="#f4f6f7" stroke="#d5dbdb"/><text x="1410" y="412" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1b2631">Ölçüler (ölçüldü)</text><text x="1410" y="442" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">· Servo yuvası 20,0–20,1 mm</text><text x="1410" y="468" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">· Horn deseni 10,0 mm</text><text x="1410" y="494" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">· Rulman 625 (5×16×5)</text><text x="1410" y="520" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">· Göz deliği Ø20 · çerçeve Ø28</text><text x="1410" y="546" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">· Çerçeve geçişi 7×7 mm</text><text x="1410" y="572" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">· Yuva derinliği ≈3,6–4,0 mm</text></svg>