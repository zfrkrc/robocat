<text x="970" y="399" fill="#f2f6fa" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">5 V ELEKTRONİK HATTI</text>
<text x="970" y="430" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Mega, kameralar ve sensörler</text>
<text x="970" y="455" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">USB geri beslemesi önlenecek</text>
<text x="970" y="480" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Gaz ısıtıcıları bütçeye eklenecek</text>
