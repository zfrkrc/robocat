<path d="M1310 212 L1370 212 L1370 620 L1310 620" fill="none" stroke="#5bb8c8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1130 510 L1130 585" fill="none" stroke="#5bb8c8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="48" y="735" fill="#d7ba7e" font-size="16" font-family="DejaVu Sans,sans-serif">BMS, regülatör ve şarj cihazı aynı işlev değildir. 6S BMS bu 3S pakete uygun değildir.</text>
<text x="48" y="760" fill="#d7ba7e" font-size="16" font-family="DejaVu Sans,sans-serif">Bu bir güç mimarisi diyagramıdır: sigorta / kablo / regülatör değerleri seçilip test edilmeden üretime gönderilmez.</text>
<text x="48" y="785" fill="#d7ba7e" font-size="16" font-family="DejaVu Sans,sans-serif">Yedek paket varsa kapalı robotta değiştirilir. İki paket doğrudan paralel bağlanmaz.</text>
</svg>