<text x="70" y="280" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">11,1 V nominal / 12,6 V dolu</text>
<text x="70" y="305" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">XT60 • balanslı haricî şarj</text>
<rect x="405" y="190" width="285" height="145" rx="16" fill="#2b251b" stroke="#d3a447" stroke-width="2"/>
<text x="425" y="224" fill="#f2f6fa" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">KORUMA + KESME</text>
<text x="425" y="255" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Uygun DC sigorta ve anahtar</text>
<text x="425" y="280" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Düşük hücre gerilimi koruması</text>
<text x="425" y="305" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Parça ve eşikler seçilecek</text>
<rect x="950" y="140" width="360" height="145" rx="16" fill="#2b251b" stroke="#d3a447" stroke-width="2"/>
<text x="970" y="174" fill="#f2f6fa" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">6 V SERVO REGÜLATÖRÜ</text>
<text x="970" y="205" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Yüksek akım / geçici yük hesabı</text>
<text x="970" y="230" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Model ve akım kapasitesi açık</text>
<text x="970" y="255" fill="#bdd0dd" font-family="DejaVu Sans,sans-serif" font-size="16">Servo beslemesine doğrudan pil yok</text>
