<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="660" viewBox="0 0 1700 660"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#85929e"/></marker></defs><rect width="1700" height="660" fill="#fbfaf7"/><text x="40" y="52" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#1b2631">RoboCat — uygulama akışı</text><text x="40" y="78" font-family="DejaVu Sans" font-size="12.5" fill="#5d6d7e">Bir adım geçmeden sonrakine geçilmez · her baskı tek iş · otomatik başlatma yok</text><rect x="40" y="120" width="290" height="205" rx="12" fill="#ffffff" stroke="#2471a3" stroke-width="2"/><circle cx="66" cy="150" r="15" fill="#2471a3"/><text x="66" y="156" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="92" y="155" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#1b2631">HAZIRLIK</text><text x="56" y="176" font-family="DejaVu Sans" font-size="11" fill="#5d6d7e">PETG: sıcaklık ürün etiketinden</text><text x="58" y="196" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Makara etiketi ve sıcaklık aralığı doğrula</text><text x="58" y="217" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Yatak: deterjan → IPA</text><text x="58" y="238" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Profil ve sınır kontrolü (X0-280 / Y0-260)</text><text x="58" y="259" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Dilim önizleme + gcode sınır ölçümü</text><rect x="370" y="120" width="290" height="205" rx="12" fill="#ffffff" stroke="#2471a3" stroke-width="2"/><circle cx="396" cy="150" r="15" fill="#2471a3"/><text x="396" y="156" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="422" y="155" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#1b2631">BASKI (tek iş)</text><text x="386" y="176" font-family="DejaVu Sans" font-size="11" fill="#5d6d7e">v0.5: metalik önce</text><text x="388" y="196" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· M01 kupon → M02 CAT06B</text><text x="388" y="217" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Kuru uyum: yuva, delik, geçme</text><text x="388" y="238" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· İlk katman gözetimi</text><text x="388" y="259" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Başarısızsa dur, ayar düzelt</text><rect x="700" y="120" width="290" height="205" rx="12" fill="#ffffff" stroke="#7d3c98" stroke-width="2"/><circle cx="726" cy="150" r="15" fill="#7d3c98"/><text x="726" y="156" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="752" y="155" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#1b2631">MONTAJ</text><text x="718" y="182" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Servo merkezle (≈1500 µs)</text><text x="718" y="203" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· 25T horn · 10,0 mm desen</text><text x="718" y="224" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· 625 rulman (5×16×5) Ø16 cep</text><text x="718" y="245" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Bacak zinciri → kafa (yapıştırma)</text><rect x="1030" y="120" width="290" height="205" rx="12" fill="#ffffff" stroke="#b03a2e" stroke-width="2"/><circle cx="1056" cy="150" r="15" fill="#b03a2e"/><text x="1056" y="156" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="1082" y="155" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#1b2631">GÜÇ</text><text x="1048" y="182" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· 3S → sigorta → ana kesme</text><text x="1048" y="203" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· 6 V servo barası (≥15-20 A)</text><text x="1048" y="224" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· 5 V elektronik ayrı hat</text><text x="1048" y="245" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Ortak GND · breadboard yok</text><rect x="1360" y="120" width="290" height="205" rx="12" fill="#ffffff" stroke="#148f77" stroke-width="2"/><circle cx="1386" cy="150" r="15" fill="#148f77"/><text x="1386" y="156" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="1412" y="155" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#1b2631">TEST</text><text x="1378" y="182" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Tek servo: merkez/yön/limit</text><text x="1378" y="203" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Tek bacak: sıkışma, akım, ısı</text><text x="1378" y="224" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Destekli gövde: 3→6→12 servo</text><text x="1378" y="245" font-family="DejaVu Sans" font-size="12" fill="#5d6d7e">· Yürüyüş + ek yük</text><line x1="330" y1="222" x2="370" y2="222" stroke="#85929e" stroke-width="2.2" marker-end="url(#a)"/><line x1="660" y1="222" x2="700" y2="222" stroke="#85929e" stroke-width="2.2" marker-end="url(#a)"/><line x1="990" y1="222" x2="1030" y2="222" stroke="#85929e" stroke-width="2.2" marker-end="url(#a)"/><line x1="1320" y1="222" x2="1360" y2="222" stroke="#85929e" stroke-width="2.2" marker-end="url(#a)"/><path d="M1505,325 C1505,400 845,400 845,335" fill="none" stroke="#b9770e" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#a)"/><rect x="1010" y="372" width="330" height="26" rx="6" fill="#fbfaf7"/><text x="1175" y="390" font-family="DejaVu Sans" font-size="11.5" fill="#b9770e" text-anchor="middle">uyum/ısı başarısız → baskı veya montaja dön</text><rect x="40" y="430" width="1610" height="120" rx="12" fill="#f4f6f7" stroke="#d5dbdb"/><text x="60" y="462" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1b2631">Geçiş ölçütleri</text><text x="60" y="490" font-family="DejaVu Sans" font-size="12.5" fill="#5d6d7e">Baskı→montaj: çap/geçme elle uyuyor · Montaj→güç: eklemler serbest, horn oturmuş · Güç→test: 6,0 V ölçüldü, sigorta takılı · Test→yürüyüş: 12 servo destekli gövdede 5 dk sorunsuz, servo gövdesi &lt;60 °C</text><text x="60" y="516" font-family="DejaVu Sans" font-size="12.5" fill="#5d6d7e">Hiçbir adım önceki doğrulanmadan tamamlanmış sayılmaz; CAT10 / BAT01 / eski 18650 parçaları ve doğrulanmamış omuz braketi bu akışta yoktur.</text><text x="40" y="590" font-family="DejaVu Sans" font-size="11.5" fill="#5d6d7e">Ayrıntı: docs/KILAVUZ.md · docs/KURULUM.md · docs/BAGLANTI.md · hardware/PCB_PLAN_REV_A.md</text></svg>